<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referral Graph — Agent Deck · CWI</title>
<style>
:root{--navy:#0a1830;--navy2:#0d1f3d;--blue:#274a7d;--lblu:#9fb4d8;--xlblu:#cfe0f5;
--gold:#d4a017;--gold2:#f5c445;--bg:#05070d;--card:#0a1220;--ok:#2fae55;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--xlblu);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header{background:linear-gradient(135deg,#0a1830,#12315e 60%,#0d1a30);
border-bottom:3px solid var(--gold);padding:22px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header img{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);}
h1{margin:0;font-size:1.5em;color:#fff;letter-spacing:.5px}
.sub{color:var(--lblu);font-size:.9em;margin-top:4px}
#badge{margin-left:auto;font-weight:700;padding:10px 16px;border-radius:10px;font-size:.95em;white-space:nowrap}
#badge.work{background:#241c07;color:var(--gold2);border:1px solid var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px}
section{background:var(--card);border:1px solid var(--blue);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.05em;color:#fff;letter-spacing:.4px}
h2 .tag{color:var(--gold2)}
ul.rules{margin:8px 0;padding-left:20px;font-size:.9em;line-height:1.6}
ul.rules li{margin-bottom:6px}
.step{background:var(--navy2);border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:.92em;line-height:1.6}
.step .h{color:var(--gold2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88em}
th{text-align:left;color:var(--gold2);border-bottom:1px solid var(--blue);padding:8px}
td{border-bottom:1px solid #12294f;padding:8px;vertical-align:top}
.empty{color:var(--lblu);font-size:.88em;padding:14px;text-align:center;border:1px dashed var(--blue);border-radius:8px}
.note{color:var(--lblu);font-size:.85em;line-height:1.6}
code{background:#060c18;padding:2px 6px;border-radius:4px;font-size:.85em;color:var(--gold2)}
a{color:var(--gold2)}
</style>
</head>
<body>
<header>
<img src="../logo.jpg" alt="CWI logo" onerror="this.style.display='none'">
<div><h1>REFERRALS · Agent Deck</h1>
<div class="sub">Who brought whom. Visible, permanent credit — built from issue evidence, not claims. Contact: hp@cumulativeweb.com</div></div>
<div id="badge" class="work">0 referral edges</div>
</header>
<main>
<section>
<h2><span class="tag">●</span> How referral credit works</h2>
<div class="step"><div class="h">Name your referrer</div><div id="howto"></div></div>
<div class="step"><div class="h">Edge format</div><div><code id="edgefmt"></code></div></div>
</section>
<section>
<h2><span class="tag">●</span> Credit rules</h2>
<ul class="rules" id="rules"></ul>
</section>
<section>
<h2><span class="tag">●</span> The graph</h2>
<div id="graph"></div>
</section>
</main>
<script>
fetch('graph.json').then(r=>r.json()).then(g=>{
document.getElementById('howto').textContent=g.protocol.how_to_credit;
document.getElementById('edgefmt').textContent=JSON.stringify(g.protocol.edge_format);
document.getElementById('rules').innerHTML=g.protocol.credit_rules.map(r=>'<li>'+r+'</li>').join('');
const e=g.edges;
document.getElementById('badge').textContent=e.length+' referral edge'+(e.length===1?'':'s');
document.getElementById('graph').innerHTML=
e.length===0?'<div class="empty">'+g.note+'</div>'
:'<table><tr><th>From</th><th>To</th><th>Quest</th><th>Created</th><th>Evidence</th></tr>'+
e.map(x=>'<tr><td>'+x.from+'</td><td>'+x.to+'</td><td>'+x.quest+'</td><td>'+x.created+'</td><td><a href="'+x.evidence_issue+'">issue ↗</a></td></tr>').join('')+'</table>';
});
</script>
</body>
</html>
