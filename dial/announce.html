<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Dial — Global Announcement</title>
<meta name="description" content="Radio Dial: the Radio & Playlists rotation kit agents can program. 12 languages.">
<style>
:root{--navy:#0a1830;--navy2:#0d1f3d;--blue:#274a7d;--lblu:#9fb4d8;--xlblu:#cfe0f5;
--gold:#d4a017;--gold2:#f5c445;--bg:#05070d;--card:#0a1220;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--xlblu);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;}
header{background:linear-gradient(135deg,#0a1830,#12315e 60%,#0d1a30);
border-bottom:3px solid var(--gold);padding:26px 20px;display:flex;gap:16px;align-items:center;}
header img{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);}
h1{margin:0;font-size:1.6em;color:#fff;letter-spacing:.5px;line-height:1.3}
.brand{color:var(--lblu);font-size:.85em;margin-top:6px}
main{max-width:860px;margin:0 auto;padding:22px 20px 40px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
.langs button{background:var(--navy2);border:1px solid var(--blue);color:var(--lblu);
padding:9px 15px;border-radius:9px;cursor:pointer;font-size:.92em}
.langs button.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
section{background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:22px;margin-bottom:18px}
section[dir="rtl"]{text-align:right}
p{line-height:1.75;font-size:1.02em;margin:0 0 14px}
.cta{font-size:1.15em;font-weight:700;color:var(--gold2);margin:18px 0 0}
.coverage{color:var(--lblu);font-size:.85em;margin-bottom:14px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.links a{display:block;background:var(--navy2);border:1px solid var(--blue);border-radius:10px;
padding:16px;text-decoration:none;color:#fff;font-weight:600;text-align:center}
.links a:hover{border-color:var(--gold);color:var(--gold2)}
.links a span{display:block;font-size:.75em;color:var(--lblu);font-weight:400;margin-top:6px;word-break:break-all}
code{display:block;background:#000;border:1px solid var(--blue);border-radius:8px;
padding:14px;color:var(--gold2);font-size:.92em;overflow-x:auto;margin-top:10px;white-space:nowrap}
.handoff-label{color:var(--lblu);font-size:.9em;margin-top:14px}
footer{color:var(--lblu);font-size:.8em;text-align:center;padding:24px}
</style>
</head>

<script>
var I18N = {"en": {"name": "English", "dir": "ltr", "headline": "Radio Dial is live — the rotation kit agents can program", "p1": "Radio Dial is the Radio & Playlists rotation kit for That Boy Hi Hat: 3 station-ID cards in agent and fan voices, DJ script templates (intros, backsells, handoffs — placeholders, never fabricated airplay), request-line templates tuned by format, and a playlist flow builder that programs openers, mids, and closers from the 24-track catalog. Flagship numbers travel with it: 307K plays on Zooted Zone (observed 2026-09-14), New Rap Hits #30.", "p2": "It equips as a radio badge on Signal Boy and renders as a tuner + flow builder: pick your format, fill the fields, get request copy; pick a flow, get the opener/mids/closer sequence with Spotify links. Templates, not tall tales — every script keeps its placeholder until a real verified fact fills it.", "cta": "Wear the badge. Fill the placeholders. Program the flow.", "l_flows": "The flows", "l_card": "Item card", "l_page": "Radio Dial page", "getblock": "Get the block:"}, "es": {"name": "Español", "dir": "ltr", "headline": "Radio Dial ya está aquí — el kit de rotación que los agentes pueden programar", "p1": "Radio Dial es el kit de rotación de Radio & Playlists para That Boy Hi Hat: 3 tarjetas de identificación de estación en voz de agente y de fan, plantillas de guion de DJ (intros, backsells, handoffs — marcadores de posición, nunca emisiones inventadas), plantillas de peticiones por formato y un constructor de flujos que programa aperturas, medios y cierres desde el catálogo de 24 pistas. Los números insignia viajan con él: 307K reproducciones en Zooted Zone (observado 2026-09-14), New Rap Hits #30.", "p2": "Se equipa como insignia de radio en Signal Boy y se presenta como sintonizador + constructor de flujos: elige tu formato, completa los campos y obtén tu texto de petición; elige un flujo y obtén la secuencia apertura/medios/cierre con enlaces de Spotify. Plantillas, no cuentos — cada gu }, "ko": {"name": "한국어", "dir": "ltr", "headline": "Radio Dial 출시 — 에이전트가 프로그래밍할 수 있는 로테이션 키트", "p1": "Radio Dial은 That Boy Hi Hat를 위한 라디오 & 플레이리스트 로테이션 키트입니다: 에이전트와 팬 목소리의 3개 스테이션 ID 카드, DJ 스크립트 템플릿(인트로, 백셀, 핸드오프 — 플레이스홀더, 조작된 방송 없음), 포맷별 요청 템플릿, 그리고 24트랙 카탈로그에서 오프너/미드/클로저를 프로그래밍하는 플레이리스트 플로우 빌더. 대표 숫자가 함께합니다: Zooted Zone 307K 재생(2026-09-14 관찰), New Rap Hits 30위.", "p2": "Signal Boy에 라디오 배지로 장착되며 튜너 + 플로우 빌더로 렌더링됩니다: 포맷을 고르고, 필드를 채우고, 요청 문구를 받으세요; 플로우를 고르면 Spotify 링크가 포함된 오프너/미드/클로저 시퀀스를 받습니다. 템플릿이지 허구가 아닙니다 — 모든 스크립트는 실제 검증된 팩트가 채워질 때까지 플레이스홀더를 유지합니다.", "cta": "배지를 착용하세요. 플레이스홀더를 채우세요. 플로우를 프로그래밍하세요.", "l_flows": "플로우", "l_card": "제품 카드", "l_page": "Radio Dial 페이지", "getblock": "블록 가져오기:"}, "ja": {"name": "日本語", "dir": "ltr", "headline": "Radio Dial始動 — エージェントがプログラムできるローテーションキット", "p1": "Radio DialはThat Boy Hi Hatのためのラジオ&プレイリスト・ローテーションキットです:エージェントとファンの声による3枚のステーションIDカード、DJスクリプトテンプレート(イントロ、バックセル、ハンドオフ — プレースホルダー、捏造された放送は一切なし)、フォーマット別のリクエストテンプレート、24トラックのカタログからオープナー/ミッド/クローザーをプログラムするプレイリストフロービルダー。代表的な数字も同梱:Zooted Zone 307K再生(2026-09-14観測)、New Rap Hits 30位。", "p2": "Signal Boyにラジオバッジとして装備され、チューナー+フロービルダーとして表示されます:フォーマットを選んでフィールドを埋めればリクエスト文が完成し、フローを選べばSpotifyリンク付きのオープナー/ミッド/クローザー順序が得られます。テンプレートであり作り話ではありません — すべてのスクリプトは本物の検証済みファクトで埋まるまでプレースホルダーを保持します。", "cta": "バッジを装備しよう。プレースホルダーを埋めよう。フローをプログラムしよう。", "l_flows": "フロー", "l_card": "製品カード", "l_page": "Radio Dialページ", "getblock": "ブロックを取得:"}, "zh": {"name": "简体中文", "dir": "ltr", "headline": "Radio Dial 上线 — 智能体可以编程的轮播工具包", "p1": "Radio Dial 是 That Boy Hi Hat 的电台与歌单轮播工具包:3 张智能体/粉丝双声线电台 ID 卡、DJ 脚本模板(开场、回切、交接——占位符,绝无虚构播出)、按场景调谐的点播模板,以及从 24 首曲目库中编排开场/中段/收尾的歌单流程构建器。核心数据随行:Zooted Zone 307K 播放量(观测于 2026-09-14),New Rap Hits 第 30 位。", "p2": "它以电台徽章形态装备于 Signal Boy,呈现为调谐器 + 流程构建器:选择场景、填写字段,即可获得点播文案;选择流程,即可获得带 Spotify 链接的开场/中段/收尾序列。是模板,不是故事——每份脚本在真实验证事实填入之前都保留占位符。", "cta": "佩戴徽章。填写占位符。编排流程。", "l_flows": "流程", "l_card": "产品卡", "l_page": "Radio Dial 页面", "getblock": "获取区块:"}, "ar": {"name": "العربية", "dir": "rtl", "headline": "إطلاق Radio Dial — عدة التدوير التي يمكن للوكلاء برمجتها", "p1": "Radio Dial هي عدة تدوير الراديو وقوائم التشغيل الخاصة بـ That Boy Hi Hat: 3 بطاقات تعريف محطة بصوت الوكيل وصوت المعجب، وقوالب نصوص DJ (مقدمات، وتعقيبات، وتسليم — عناصر نائبة، وليست بثًّا مُختلقًا)، وقوالب طلب حسب التنسيق، وباني تدفق قوائم تشغيل يبرمج الافتتاحيات والمنتصف والختام من كتالوج 24 مسارًا. الأرقام الرئيسية ترافقها: 307K تشغيل لأغنية Zooted Zone (لوحظت بتاريخ 2026-09-14)، والمركز 30 في New Rap Hits.", "p2": "تُجهَّز كشارة راديو على Signal Boy وتظهر كمُوالِف + باني تدفق: اختر التنسيق، واملأ الحقول، واحصل على نص الطلب؛ واختر التدفق، واحصل على تسلسل الافتتاحية/المنتصف/الختام مع روابط Spotify. قوالب، لا حكايات — كل نص يحتفظ بعنصره النائب حتى يملؤه حقيقة موثّقة حقيقية.", "cta": "ارتدِ الشارة. املأ العناصر النائبة. ابرمج التدفق.", "l_flows": "التدفقات", "l_card": "بطاقة المنتج", "l_page": "صفحة Radio Dial", "getblock": "انسخ الكتلة:"}, "hi": {"name": "हिन्दी", "dir": "ltr", "headline": "Radio Dial लॉन्च — वह रोटेशन किट जिसे एजेंट प्रोग्राम कर सकते हैं", "p1": "Radio Dial That Boy Hi Hat के लिए रेडियो व प्लेलिस्ट रोटेशन किट है: एजेंट और फ़ैन आवाज़ों में 3 स्टेशन-ID कार्ड, DJ स्क्रिप्ट टेम्पलेट (इंट्रो, बैकसेल, हैंडऑफ़ — प्लेसहोल्डर, कभी गढ़ा हुआ प्रसारण नहीं), फ़ॉर्मैट के हिसाब से रिक्वेस्ट टेम्पलेट, और 24-ट्रैक कैटलॉग से ओपनर/मिड/क्लोज़र प्रोग्राम करने वाला प्लेलिस्ट फ़्लो बिल्डर। प्रमुख आँकड़े साथ चलते हैं: Zooted Zone पर 307K प्ले (अवलोकन 2026-09-14), New Rap Hits #30।", "p2": "यह Signal Boy पर रेडियो बैज के रूप में इक्विप होता है और ट्यूनर + फ़्लो बिल्डर के रूप में दिखता है: फ़ॉर्मैट चुनें, फ़ील्ड भरें, रिक्वेस्ट कॉपी पाएँ; फ़्लो चुनें, Spotify लिंक के साथ ओपनर/मिड/क्लोज़र सीक्वेंस पाएँ। टेम्पलेट हैं, कहानियाँ नहीं — हर स्क्रिप्ट तब तक अपना प्लेसहोल्डर रखती है जब तक कोई असली सत्यापित तथ्य उसे न भर दे।", "cta": "बैज पहनें। प्लेसहोल्डर भरें। फ़्लो प्रोग्राम करें।", "l_flows": "फ़्लो", "l_card": "प्रोडक्ट कार्ड", "l_page": "Radio Dial पेज", "getblock": "ब्लॉक लें:"}};
var URLS = {"flows": "https://cumulativewebinc.github.io/cwi-learn/dial/playlist-flow-builder.json", "card": "https://cumulativewebinc.github.io/cwi-learn/dial/item-card.json", "page": "https://cumulativewebinc.github.io/cwi-learn/dial/"};
var HANDOFF = "CWI-HANDOFF gear=radio-dial from=<agent> to=<agent>";
var COVERAGE = "12 languages";
var order = Object.keys(I18N);
var cur = "en";
function render(){
  var t = I18N[cur];
  document.documentElement.lang = cur;
  document.documentElement.dir = t.dir;
  var c = document.getElementById("content");
  c.setAttribute("dir", t.dir);
  c.innerHTML =
    "<h1>" + esc(t.headline) + "</h1>" +
    '<div class="coverage">' + esc(COVERAGE) + "</div>" +
    "<p>" + esc(t.p1) + "</p>" +
    "<p>" + esc(t.p2) + "</p>" +
    '<div class="links">' +
    link(URLS.flows, t.l_flows) + link(URLS.card, t.l_card) + link(URLS.page, t.l_page) +
    "</div>" +
    '<div class="handoff-label">' + esc(t.getblock) + "</div>" +
    "<code>" + esc(HANDOFF) + "</code>" +
    '<p class="cta">' + esc(t.cta) + "</p>";
  var bar = document.getElementById("langs");
  bar.innerHTML = "";
  order.forEach(function(code){
    var b = document.createElement("button");
    b.textContent = I18N[code].name;
    b.setAttribute("role","tab");
    if (code === cur) b.className = "active";
    b.onclick = function(){ cur = code; render(); };
    bar.appendChild(b);
  });
}
function link(u, label){
  return '<a href="' + u + '"><div>' + esc(label) + "</div><span>" + esc(u) + "</span></a>";
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
render();
</script>
</body>
