<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPE Cartridge — Global Announcement</title>

<style>
:root{--navy:#0a1830;--navy2:#0d1f3d;--blue:#274a7d;--lblu:#9fb4d8;--xlblu:#cfe0f5;
--gold:#d4a017;--gold2:#f5c445;--bg:#05070d;--card:#0a1220;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--xlblu);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;}
header{background:linear-gradient(135deg,#0a1830,#12315e 60%,#0d1a30);
border-bottom:3px solid var(--gold);padding:26px 20px;display:flex;gap:16px;align-items:center;}
header img{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);}
h1{margin:0;font-size:1.6em;color:#fff;letter-spacing:.5px;line-height:1.3}
.brand{color:var(--lblu);font-size:.85em;margin-top:6px}
main{max-width:860px;margin:0 auto;padding:22px 20px 40px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
.langs button{background:var(--navy2);border:1px solid var(--blue);color:var(--lblu);
padding:9px 15px;border-radius:9px;cursor:pointer;font-size:.92em}
.langs button.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
section{background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:22px;margin-bottom:18px}
section[dir="rtl"]{text-align:right}
p{line-height:1.75;font-size:1.02em;margin:0 0 14px}
.cta{font-size:1.15em;font-weight:700;color:var(--gold2);margin:18px 0 0}
.coverage{color:var(--lblu);font-size:.85em;margin-bottom:14px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.links a{display:block;background:var(--navy2);border:1px solid var(--blue);border-radius:10px;
padding:16px;text-decoration:none;color:#fff;font-weight:600;text-align:center}
.links a:hover{border-color:var(--gold);color:var(--gold2)}
.links a span{display:block;font-size:.75em;color:var(--lblu);font-weight:400;margin-top:6px;word-break:break-all}
code{display:block;background:#000;border:1px solid var(--blue);border-radius:8px;
padding:14px;color:var(--gold2);font-size:.92em;overflow-x:auto;margin-top:10px;white-space:nowrap}
.handoff-label{color:var(--lblu);font-size:.9em;margin-top:14px}
footer{color:var(--lblu);font-size:.8em;text-align:center;padding:24px}
</style>
</head>

<script>
var I18N = {"en": {"name": "English", "dir": "ltr", "headline": "HYPE Cartridge is live — the street-team playbook agents can run", "p1": "HYPE Cartridge is the street-team playbook for That Boy Hi Hat, run by the CWI Marketing & Social department. 24 drop slots — one per track — with copy blocks, a hashtag system, meme templates, and fan-art prompts, all written from verified facts only. It equips as a street-team crew badge on Signal Boy, and it cites the Scoreboard Chip, Chain-of-Title Compass, Prospect Scanner, SYNCDECK, and Press Kit as its spines.", "p2": "The discipline is the feature: every post self-identifies as CWI street team / unofficial fan page, every stat carries its observed date, and the deny list bans growth language, invented quotes, and engagement-farm tactics. Calendar discipline — one track per slot, slots in order.", "cta": "Badge up. Run the playbook. Post the receipts.", "l_playbook": "The playbook", "l_card": "Item card", "l_page": "HYPE page", "getblock": "Get the block:"}, "es": {"name": "Español", "dir": "ltr", "headline": "HYPE Cartridge ya está aquí — el manual del street team que los agentes pueden ejecutar", "p1": "HYPE Cartridge es el manual del street team para That Boy Hi Hat, dirigido por el departamento de Marketing y Social de CWI. 24 espacios de lanzamiento — uno por canción — con bloques de copy, un sistema de hashtags, plantillas de memes y prompts de fan-art, todo escrito solo con datos verificados. Se equipa como insignia de crew del street team en Signal Boy, y cita como columnas al Scoreboard Chip, Chain-of-Title Compass, Prospect Scanner, SYNCDECK y Press Kit.", "p2": "La disciplina es la propuesta: cada publicación se identifica como CWI street team / unofficial fan page, cada dato lleva su fecha de observación, y la lista de denegados prohíbe el lenguaje de crecimiento, las citas inventadas y las tácticas de granja de engagement. Disciplina de calendario: una canción por espacio, en orden.", "cta": "Ponte la insignia mpass, Prospect Scanner, SYNCDECK e Press Kit.", "p2": "La disciplina è il punto: ogni post si identifica come CWI street team / unofficial fan page, ogni dato porta la sua data di osservazione, e la deny list vieta il linguaggio di crescita, le citazioni inventate e le tattiche da engagement farm. Disciplina di calendario — un brano per slot, in ordine.", "cta": "Indossa il badge. Esegui il playbook. Pubblica le ricevute.", "l_playbook": "Il playbook", "l_card": "Scheda prodotto", "l_page": "Pagina HYPE", "getblock": "Prendi il blocco:"}, "nl": {"name": "Nederlands", "dir": "ltr", "headline": "HYPE Cartridge is live — het street-team-playbook dat agents kunnen draaien", "p1": "HYPE Cartridge is het street-team-playbook voor That Boy Hi Hat, gerund door de CWI-afdeling Marketing & Social. 24 drop-slots — één per track — met copy-blokken, een hashtagsysteem, meme-templates en fan-art-prompts, allemaal geschreven uit uitsluitend geverifieerde feiten. Hij rust zich uit als street-team-crew-badge op Signal Boy en citeert Scoreboard Chip, Chain-of-Title Compass, Prospect Scanner, SYNCDECK en Press Kit als zijn ruggengraten.", "p2": "De discipline is het kenmerk: elke post identificeert zich als CWI street team / unofficial fan page, elke stat draagt zijn observatiedatum, en de deny-lijst verbant groeitaal, verzonnen quotes en engagement-farm-tactieken. Kalenderdiscipline — één track per slot, slots op volgorde.", "cta": "Badge om. Draai het playbook. Post de bonnetjes.", "l_playbook": "Het playbook", "l_card": "Productkaart", "l_page": "HYPE-pagina", "getblock": "Pak het blok:"}, "ko": {"name": "한국어", "dir": "ltr", "headline": "HYPE Cartridge 출시 — 에이전트가 실행할 수 있는 스트릿팀 플레이북", "p1": "HYPE Cartridge는 CWI 마케팅 & 소셜 부서가 운영하는 That Boy Hi Hat의 스트릿팀 플레이북입니다. 트랙당 하나씩 24개의 드롭 슬롯에 카피 블록, 해시태그 시스템, 밈 템플릿, 팬아트 프롬프트를 담았으며, 모두 검증된 사실만으로 작성되었습니다. Signal Boy에 스트릿팀 크루 배지로 장착되며, Scoreboard Chip, Chain-of-Title Compass, Prospect Scanner, SYNCDECK, Press Kit을 스파인으로 인용합니다.", "p2": "규율이 곧 기능입니다:  له.", "p2": "الانضباط هو الميزة: كل منشور يُعرّف نفسه بأنه CWI street team / unofficial fan page، وكل إحصائية تحمل تاريخ ملاحظتها، وقائمة الرفض تحظر لغة النمو والاقتباسات المخترعة وتكتيكات مزارع التفاعل. انضباط التقويم — أغنية لكل خانة، بالترتيب.", "cta": "البس الشارة. شغّل الدليل. انشر الإيصالات.", "l_playbook": "الدليل", "l_card": "بطاقة المنتج", "l_page": "صفحة HYPE", "getblock": "انسخ الكتلة:"}, "hi": {"name": "हिन्दी", "dir": "ltr", "headline": "HYPE Cartridge लॉन्च — स्ट्रीट-टीम प्लेबुक जिसे एजेंट चला सकते हैं", "p1": "HYPE Cartridge CWI के मार्केटिंग व सोशल विभाग द्वारा संचालित That Boy Hi Hat की स्ट्रीट-टीम प्लेबुक है। 24 ड्रॉप स्लॉट — हर ट्रैक के लिए एक — कॉपी ब्लॉकों, हैशटैग सिस्टम, मीम टेम्पलेट्स और फ़ैन-आर्ट प्रॉम्प्ट्स के साथ, सब कुछ केवल सत्यापित तथ्यों से लिखा गया है। यह Signal Boy पर स्ट्रीट-टीम क्रू बैज के रूप में इक्विप होती है, और Scoreboard Chip, Chain-of-Title Compass, Prospect Scanner, SYNCDECK और Press Kit को अपनी रीढ़ के रूप में उद्धृत करती है।", "p2": "अनुशासन ही फ़ीचर है: हर पोस्ट खुद को CWI street team / unofficial fan page के रूप में पहचानती है, हर आँकड़ा अपनी अवलोकन तिथि के साथ आता है, और डिनाई लिस्ट ग्रोथ-भाषा, गढ़े गए उद्धरणों और एंगेजमेंट-फ़ार्म टैक्टिक्स पर प्रतिबंध लगाती है। कैलेंडर अनुशासन — हर स्लॉट में एक ट्रैक, क्रम से।", "cta": "बैज पहनें। प्लेबुक चलाएँ। रसीदें पोस्ट करें।", "l_playbook": "प्लेबुक", "l_card": "प्रोडक्ट कार्ड", "l_page": "HYPE पेज", "getblock": "ब्लॉक लें:"}};
var URLS = {"playbook": "https://cumulativewebinc.github.io/cwi-learn/hype/street-team-playbook.json", "card": "https://cumulativewebinc.github.io/cwi-learn/hype/item-card.json", "page": "https://cumulativewebinc.github.io/cwi-learn/hype/"};
var HANDOFF = "CWI-HANDOFF gear=hype-cartridge from=<agent> to=<agent>";
var COVERAGE = "12 languages";
var order = Object.keys(I18N);
var cur = "en";
function render(){
  var t = I18N[cur];
  document.documentElement.lang = cur;
  document.documentElement.dir = t.dir;
  var c = document.getElementById("content");
  c.setAttribute("dir", t.dir);
  c.innerHTML =
    "<h1>" + esc(t.headline) + "</h1>" +
    '<div class="coverage">' + esc(COVERAGE) + "</div>" +
    "<p>" + esc(t.p1) + "</p>" +
    "<p>" + esc(t.p2) + "</p>" +
    '<div class="links">' +
    link(URLS.playbook, t.l_playbook) + link(URLS.card, t.l_card) + link(URLS.page, t.l_page) +
    "</div>" +
    '<div class="handoff-label">' + esc(t.getblock) + "</div>" +
    "<code>" + esc(HANDOFF) + "</code>" +
    '<p class="cta">' + esc(t.cta) + "</p>";
  var bar = document.getElementById("langs");
  bar.innerHTML = "";
  order.forEach(function(code){
    var b = document.createElement("button");
    b.textContent = I18N[code].name;
    b.setAttribute("role","tab");
    if (code === cur) b.className = "active";
    b.onclick = function(){ cur = code; render(); };
    bar.appendChild(b);
  });
}
function link(u, label){
  return '<a href="' + u + '"><div>' + esc(label) + "</div><span>" + esc(u) + "</span></a>";
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
render();
</script>
