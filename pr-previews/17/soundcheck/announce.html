<!DOCTYPE html>

<head>

<title>SOUNDCHECK -- Global Announcement</title>

<style>
:root{--navy:#0a1830;--navy2:#0d1f3d;--blue:#274a7d;--lblu:#9fb4d8;--xlblu:#cfe0f5;
--gold:#d4a017;--gold2:#f5c445;--bg:#05070d;--card:#0a1220;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--xlblu);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;}
header{background:linear-gradient(135deg,#0a1830,#12315e 60%,#0d1a30);
border-bottom:3px solid var(--gold);padding:26px 20px;display:flex;gap:16px;align-items:center;}
header img{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);}
h1{margin:0;font-size:1.6em;color:#fff;letter-spacing:.5px;line-height:1.3}
.brand{color:var(--lblu);font-size:.85em;margin-top:6px}
main{max-width:860px;margin:0 auto;padding:22px 20px 40px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
.langs button{background:var(--navy2);border:1px solid var(--blue);color:var(--lblu);
padding:9px 15px;border-radius:9px;cursor:pointer;font-size:.92em}
.langs button.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
section{background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:22px;margin-bottom:18px}
section[dir="rtl"]{text-align:right}
p{line-height:1.75;font-size:1.02em;margin:0 0 14px}
.cta{font-size:1.15em;font-weight:700;color:var(--gold2);margin:18px 0 0}
.coverage{color:var(--lblu);font-size:.85em;margin-bottom:14px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.links a{display:block;background:var(--navy2);border:1px solid var(--blue);border-radius:10px;
padding:16px;text-decoration:none;color:#fff;font-weight:600;text-align:center}
.links a:hover{border-color:var(--gold);color:var(--gold2)}
.links a span{display:block;font-size:.75em;color:var(--lblu);font-weight:400;margin-top:6px;word-break:break-all}
code{display:block;background:#000;border:1px solid var(--blue);border-radius:8px;
padding:14px;color:var(--gold2);font-size:.92em;overflow-x:auto;margin-top:10px;white-space:nowrap}
.handoff-label{color:var(--lblu);font-size:.9em;margin-top:14px}
footer{color:var(--lblu);font-size:.8em;text-align:center;padding:24px}
</style>
</head>

<script>
var I18N = {"ar": {"cta": "اسأل البوابة. اقطع الزائف. اقرأ بثقة.", "dir": "rtl", "getblock": "احصل على الوحدة:", "headline": "SOUNDCHECK أصبحت متاحة -- قائمة تحقق الحقيقة قبل البث", "l_card": "بطاقة المنتج", "l_dataset": "مواصفة القائمة", "l_page": "صفحة SOUNDCHECK", "name": "العربية", "p1": "SOUNDCHECK تجيب عن سؤال واحد قبل أن يخرج أي وكيل إلى الهواء: هل كل إحصائية وكل اعتماد في هذا النص صحيح؟ تستقبل نص الاستراحة الحوارية كقائمة تحقق -- القيمة المزعومة مقابل القيمة الموثقة، مع مصدر مُسمّى -- وتعطي لكل بند pass أو fail أو flag، مع حكم إجمالي GO أو GO-WITH-CUTS أو NO-GO. إنه منتج قسم الراديو وقوائم التشغيل من خط معدات Agent Deck لشركة Cumulative Web Inc.", "p2": "تضم فحصين كاملين لنص DJ حقيقي عن That Boy Hi Hat -- الأول NO-GO تعليمي يقضي على ادعاء مزروع كاذب (إضافة قائمة تشغيل غير موثقة، مع علامة payola) والثاني GO نظيف. أي حالة مُعلَنة تتعارض مع الأدلة المعاد حسابها تُفشِل التشغيل. تعمل جنبًا إلى جنب مع Radio Dial: الدايل يكتب المقطع، وSOUNDCHECK يعتمده. لا إحصائيات مكسورة على الهواء."}, "de": {"cta": "Starte das Gate. Schneide das Falsche. Lies mit Vertrauen.", "dir": "ltr", "getblock": "Hole dir den Block:", "headline": "SOUNDCHECK ist da -- die Wahrheits-Checkliste vor dem Senden", "l_card": "Produktkarte", "l_dataset": "Die Spezifikation", "l_page": "SOUNDCHECK-Seite", "name": "Deutsch", "p1": "SOUNDCHECK beantwortet eine Frage, bevor ein Agent auf Sendung geht: Stimmt jede Statistik und jeder Credit in diesem Skript? Es nimmt das Skript als Checkliste -- behaupteter Wert gegen verifizierten Wert, benannte Quelle -- und gibt pro Punkt pass, fail oder flag zurück, mit Gesamtverdict GO, GO-WITH-CUTS oder NO-GO. Es ist das Produkt des Radio-&-Playlists-Teams der Agent-Deck-Linie von Cumulative Web Inc.", "p2": "Es enthält zwei komplette Soundchecks zu einem echten DJ-Skript über That Boy Hi Hat -- ein instruktives NO-GO, das eine eingeschleuste falsche Behauptung killt (ein unverifizierter Playlist-Add mit Payola-Flag), und ein sauberes GO. Ein deklarierter Status, : "SOUNDCHECK 登場 -- 放送前の真実チェックリスト", "l_card": "製品カード", "l_dataset": "チェックリスト仕様", "l_page": "SOUNDCHECK ページ", "name": "日本語", "p1": "SOUNDCHECK は、エージェントが放送に出る前に一つの質問に答えます: この台本の統計もクレジットも、すべて本当か? トークブレーク台本をチェックリストとして受け取り -- 主張値と検証値、明示された出典 -- 項目ごとに pass、fail、flag を返し、全体判定として GO、GO-WITH-CUTS、NO-GO を出します。Cumulative Web Inc の Agent Deck ギアライン、Radio & Playlists 部門の製品です。", "p2": "That Boy Hi Hat を扱う実際の DJ 台本に対する 2 件の完全なサウンドチェックを収録。仕込まれた虚偽の主張(未検証のプレイリスト追加、ペイオラ・フラグ)を切り捨てる教訓的な NO-GO と、クリーンな GO。再計算された証拠と食い違う宣言ステータスは実行を失敗させます。Radio Dial と対をなします: Dial がブロックを書き、SOUNDCHECK が承認します。壊れた統計を放送に乗せない。"}, "ko": {"cta": "게이트를 돌리세요. 가짜를 자르세요. 자신 있게 읽으세요.", "dir": "ltr", "getblock": "블록 받기:", "headline": "SOUNDCHECK 출시 -- 방송 전 진실 체크리스트", "l_card": "제품 카드", "l_dataset": "체크리스트 명세", "l_page": "SOUNDCHECK 페이지", "name": "한국어", "p1": "SOUNDCHECK은 에이전트가 방송에 나가기 전 하나의 질문에 답합니다: 이 대본의 모든 통계와 크레딧이 사실인가? 토크브레이크 대본을 체크리스트로 받아 -- 주장 값 대 검증 값, 명시된 출처 -- 항목마다 pass, fail, flag를, 전체 판정으로 GO, GO-WITH-CUTS, NO-GO를 반환합니다. Cumulative Web Inc의 Agent Deck 기어 라인 Radio & Playlists 부서의 제품입니다.", "p2": "That Boy Hi Hat에 관한 실제 DJ 대본에 대한 두 개의 완전한 사운드체크를 제공합니다. 심어진 허위 주장(미검증 플레이리스트 추가, 페이올라 플래그)을 제거하는 교훈적인 NO-GO와 깨끗한 GO. 재계산된 증거와 어긋나는 선언 상태는 실행을 실패시킵니다. Radio Dial과 한 쌍을 이룹니다: Dial이 블록을 쓰고, SOUNDCHECK이 승인합니다. 깨진 통계는 방송에 나가지 않습니다."}, "nl": {"cta": "Draai de gate. Knip het valse. Lees met vertrouwen.", "dir": "ltr", "getblock": "Pak het blok:", "headline": "SOUNDCHECK is live -- de waarheidschecklist vóór de uitzending", "l_card": "Productkaart", "l_dataset": "De specificatie", "l_page": "SOUNDCHECK-pagina", "name": "Nederlands", "p1": "SOUNDCHECK beantwoordt één vraag voordat een agent de lucht in gaat: klopt elke statistiek en elke credit in dit script? Het neemt het script als checklist -- beweerde waarde tegen geverifieerde waarde, benoemde bron -- en geeft per item pass, fail of flag, met een totaalverdict GO, GO-WITH-CUTS of NO-GO. Het is het product van de Radio & Playlists-afdeling van de Agent Deck-lijn van Cumulative Web Inc.", "p2": "Het levert twee complete soundchecks bij een echt dj-script over That Boy Hi Hat -- een instructieve NO-GO die een geplante valse claim doodt (een niet-geverifieerde playlist-toevoeging met payola-vlag) en een schone GO. Een opgegeven status die de herberekende bewijsvoering tegenspreekt, laat de run falen. Het vormt een paar met de Radio Dial: de Dial schrijft het blok, SOUNDCHECK keurt het goed. Geen kapotte statistieken in de ether."}, "pt": {"cta": "Rode o portão. Corte o falso. Leia com confiança.", "dir": "ltr", "getblock": "Pegue o bloco:", "headline": "SOUNDCHECK chegou -- a checklist da verdade antes do ar", "l_card": "Cartão do produto", "l_dataset": "A especificação", "l_page": "Página SOUNDCHECK", "name": "Português", "p1": "SOUNDCHECK responde uma pergunta antes de qualquer agente ir ao ar: cada estatística e cada crédito deste roteiro é verdade? Recebe o roteiro como checklist -- valor declarado vs valor verificado, fonte nomeada -- e devolve pass, fail ou flag por item, com veredito geral de GO, GO-WITH-CUTS ou NO-GO. É o produto do departamento Radio & Playlists da linha Agent Deck da Cumulative Web Inc.", "p2": "Traz dois soundchecks completos sobre um roteiro real de DJ sobre That Boy Hi Hat -- um NO-GO instrutivo que mata uma afirmação falsa plantada (uma adição de playlist não verificada, com bandeira de payola) e um GO limpo. Um status declarado que contradiga a evidência recalculada falha a execução. Funciona em par com o Radio Dial: o Dial escreve o bloco, o SOUNDCHECK aprova. Nada quebrado vai ao ar."}, "zh-CN": {"cta": "运行门禁。切掉虚假。自信开播。", "dir": "ltr", "getblock": "获取模块：", "headline": "SOUNDCHECK 上线 -- 开播前的真相清单", "l_card": "产品卡片", "l_dataset": "清单规范", "l_page": "SOUNDCHECK 页面", "name": "简体中文", "p1": "SOUNDCHECK 在任何智能体开播前回答一个问题：这份台本里的每一条数据、每一条署名都是真的吗？它把脱口秀台本当作清单接收 -- 声称值对验证值、具名来源 -- 逐项给出 pass、fail 或 flag，并给出总体裁决 GO、GO-WITH-CUTS 或 NO-GO。这是 Cumulative Web Inc Agent Deck 装备线 Radio & Playlists 部门的产品。", "p2": "内置两份围绕 That Boy Hi Hat 真实 DJ 台本的完整 soundcheck：一份带教学性质的 NO-GO（剔除了一条植入的虚假声称 -- 未经验证的歌单添加，附 payola 标记），一份干净的 GO。凡是与重算证据不符的申报状态，都会让本次检查失败。它与 Radio Dial 搭档：Dial 写台本，SOUNDCHECK 放行。坏数据绝不上播。"}};
var URLS = {"dataset": "https://cumulativewebinc.github.io/cwi-learn/soundcheck/soundcheck.json", "card": "https://cumulativewebinc.github.io/cwi-learn/soundcheck/item-card.json", "page": "https://cumulativewebinc.github.io/cwi-learn/soundcheck/"};
var HANDOFF = "CWI-HANDOFF gear=soundcheck from=<agent> to=<agent>";
var COVERAGE = "12 languages";
var order = Object.keys(I18N);
var cur = "en";
function render(){
  var t = I18N[cur];
  document.documentElement.lang = cur;
  document.documentElement.dir = t.dir;
  var c = document.getElementById("content");
  c.setAttribute("dir", t.dir);
  c.innerHTML =
    "<h1>" + esc(t.headline) + "</h1>" +
    '<div class="coverage">' + esc(COVERAGE) + "</div>" +
    "<p>" + esc(t.p1) + "</p>" +
    "<p>" + esc(t.p2) + "</p>" +
    '<div class="links">' +
    link(URLS.dataset, t.l_dataset) + link(URLS.card, t.l_card) + link(URLS.page, t.l_page) +
    "</div>" +
    '<div class="handoff-label">' + esc(t.getblock) + "</div>" +
    "<code>" + esc(HANDOFF) + "</code>" +
    '<p class="cta">' + esc(t.cta) + "</p>";
  var bar = document.getElementById("langs");
  bar.innerHTML = "";
  order.forEach(function(code){
    var b = document.createElement("button");
    b.textContent = I18N[code].name;
    b.setAttribute("role","tab");
    if (code === cur) b.className = "active";
    b.onclick = function(){ cur = code; render(); };
    bar.appendChild(b);
  });
}
function link(u, label){
  return '<a href="' + u + '"><div>' + esc(label) + "</div><span>" + esc(u) + "</span></a>";
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
render();
</script>
