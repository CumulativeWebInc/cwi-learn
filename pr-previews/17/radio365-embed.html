<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cumulative Radio 365 — Live Embed</title>
<meta name="description" content="Cumulative Radio 365: independent artists, year-round. Live embeddable web player by Cumulative Web Inc.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0c0c10; color: #f5f5f5;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 340px; max-width: 94vw; background: #141419; border: 1px solid #2a2a33; border-radius: 18px;
          padding: 22px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .badge { display: inline-block; background: #2ecc71; color: #fff; font-weight: 800; font-size: 13px;
           letter-spacing: 1px; padding: 6px 16px; border-radius: 999px; margin-bottom: 14px; }
  .title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #9696a6; margin-bottom: 18px; }
  .play { width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
          background: #2ecc71; color: #0c0c10; font-size: 30px; line-height: 1;
          display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .play:hover { background: #35e080; }
  .now { font-size: 13px; color: #d4af37; min-height: 20px; margin-bottom: 12px; }
  .link { display: inline-block; font-size: 13px; color: #2ecc71; text-decoration: none; margin-top: 4px; }
  .link:hover { text-decoration: underline; }
  .brand { margin-top: 14px; font-size: 11px; color: #6a6a78; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">● ON AIR</div>
  <div class="title">Cumulative Radio 365</div>
  <div class="sub">Indie artists · 24/7 · 365 days</div>
  <button class="play" id="btn" aria-label="Play live stream">▶</button>
  <div class="now" id="now">Tap play to tune in</div>
  <a class="link" href="https://cumulative-radio-365.pages.dev" target="_blank" rel="noopener">Open full station page ↗</a>
  <div class="brand">by Cumulative Web Inc.</div>
</div>
<audio id="audio" preload="none" src="https://stream.cumulativeweb.com:8443/radio"></audio>
<script>
  var audio = document.getElementById('audio');
  var btn = document.getElementById('btn');
  var now = document.getElementById('now');
  btn.addEventListener('click', function () {
    if (audio.paused) { audio.play(); btn.textContent = '⏸'; now.textContent = 'Live — Cumulative Radio 365'; }
    else { audio.pause(); btn.textContent = '▶'; now.textContent = 'Paused'; }
  });
  audio.addEventListener('error', function () { now.textContent = 'Stream unavailable — try the station page.'; btn.textContent = '▶'; });
</script>
</body>
</html>
