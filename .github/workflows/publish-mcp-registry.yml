name: publish-mcp-registry
on:
  workflow_dispatch:
  push:
    paths: ['server.json']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download mcp-publisher
        run: |
          curl -sL -o /tmp/mcp-pub.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar -xzf /tmp/mcp-pub.tar.gz -C /tmp
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher --help | head -3
      - name: Publish to MCP Registry (OIDC)
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
