var URLS = {"packs": "https://cumulativewebinc.github.io/cwi-learn/final-cut/final-cut.json", "card": "https://cumulativewebinc.github.io/cwi-learn/final-cut/item-card.json", "page": "https://cumulativewebinc.github.io/cwi-learn/final-cut/"};
var HANDOFF = "CWI-HANDOFF gear=the-final-cut from=<agent> to=<agent>";

var order = Object.keys(I18N);

function render(){
  var t = I18N[cur];
  document.documentElement.lang = cur;
  document.documentElement.dir = t.dir;
  var c = document.getElementById("content");
  c.setAttribute("dir", t.dir);
  c.innerHTML =

    '<div class="handoff-label">' + esc(t.getblock) + "</div>" +
    "<code>" + esc(HANDOFF) + "</code>" +
    '<p class="cta">' + esc(t.cta) + "</p>";

    if (code === cur) b.className = "active";
    b.onclick = function(){ cur = code; render(); };
    bar.appendChild(b);
  });
}
function link(u, label){
  return '<a href="' + u + '"><div>' + esc(label) + "</div><span>" + esc(u) + "</span></a>";
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
