.card.show{display:block;animation:fade .35s ease}

.rights p{margin:6px 0}
.rights .rl{color:var(--gold2);font-weight:700}
.links{margin-top:14px}

document.getElementById("intro").innerHTML =
  "<b>" + esc(CFG.productName) + "</b> is the Sync &amp; Licensing department's draw-and-pitch kit for " +
  "That Boy Hi Hat's 24-track catalog. Every card carries a licensed use, verified credits, proof points, " +
  "clearance flags, and the exact sync rights line — checked against the Chain-of-Title Compass: cite only " +
  "DOCUMENTED fields, never overclaim. Draw a card, read it, run the pitch template.";
var useFilter = "all";
var uses = ["all"].concat(CARDS.use_cases);
var fbar = document.getElementById("filters");
uses.forEach(function(u){
  var b = document.createElement("button");
  b.textContent = u === "all" ? "all uses" : u;
  if (u === "all") b.className = "active";
  b.onclick = function(){ useFilter = u; renderDeck();
    fbar.querySelectorAll("button").forEach(function(x){x.classList.remove("active")}); b.className = "active"; };
  fbar.appendChild(b);
});
function filtered(){ return CARDS.cards.filter(function(c){
  return useFilter === "all" || c.licensed_use.use_case === useFilter; }); }
function stampBadge(s){ return s === "DOCUMENTED"
  ? '<span class="credit doc">DOCUMENTED</span>' : '<span class="credit pend">PENDING</span>'; }
function showCard(c){
  var el = document.getElementById("card");
  var cred = c.verified_credits.length
    ? "<ul>" + c.verified_credits.map(function(f){
        return "<li>" + esc(f.field) + ": " + esc(f.value) + stampBadge(f.stamp) + "</li>"; }).join("") + "</ul>"
    : "<p>" + esc(c.verified_credits_note) + "</p>";
  var proof = c.proof_points.length
    ? "<ul>" + c.proof_points.map(function(p){ return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>"
    : "<p>Proof points pending — no verified placements or play counts documented yet for this track.</p>";
  var cf = c.clearance_flags;
  el.innerHTML =
    "<h2>" + esc(c.track) + "</h2>" +
    '<div class="use">' + esc(c.licensed_use.use_case) + "</div>" +
    '<p class="suggestion">' + esc(c.licensed_use.note) + "</p>" +
    "<h3>Verified credits</h3>" + cred +
    "<h3>Proof points</h3>" + proof +
    "<h3>Clearance flags</h3><ul>" +
    "<li>explicit lyrics: " + esc(cf.explicit_per_spotify_metadata) + "</li>" +
    "<li>clean version: " + (cf.clean_version_exists ? "exists" : "none") +
    " · instrumental: " + (cf.instrumental_version_exists ? "exists" : "none") + "</li>" +
    "<li>" + esc(cf.note) + "</li></ul>" +
    '<div class="rights"><p class="rl">"' + esc(c.rights_line) + '"</p>' +
    "<p>Contact: " + esc(c.contact) + "</p></div>" +
    '<div class="links"><a href="' + c.spotify_url + '">' + esc(c.spotify_url) + "</a></div>";
  el.classList.add("show");
  el.scrollIntoView({behavior:"smooth", block:"center"});
}
function renderDeck(){
  var d = document.getElementById("deck");
  d.innerHTML = "";
  filtered().forEach(function(c){
    var m = document.createElement("div");
    m.className = "mini";
    m.innerHTML = "<b>" + esc(c.track) + "</b><span>" + esc(c.licensed_use.use_case) + "</span>";
    m.onclick = function(){ showCard(c); };
    d.appendChild(m);
  });
}
document.getElementById("drawbtn").onclick = function(){
  var pool = filtered();
  showCard(pool[Math.floor(Math.random() * pool.length)]);
};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
renderDeck();
